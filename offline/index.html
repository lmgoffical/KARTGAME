<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turbo Karts</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box;
        background: #0b0e1a; color: #f4f6fb;
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
      }
      h1 { font-size: clamp(44px, 12vw, 88px); line-height: 0.9; margin: 0 0 20px; font-style: italic; font-weight: 900; letter-spacing: -0.03em; }
      h1 span { display: block; }
      h1 span:last-child { color: #ff5a1f; }
      p { color: #9aa4bd; font-size: 18px; margin: 0; max-width: 28em; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1><span>TURBO</span><span>KARTS</span></h1>
      <p>The game is in the garage for an update. It will be back soon.</p>
    </main>
  </body>
</html>
